<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>카메라 점검</title>
<style>
body{margin:0;padding:14px;font:15px/1.45 system-ui,sans-serif;background:#fff;color:#111}
h1{font-size:19px;margin:0 0 6px}
button{width:100%;min-height:52px;font-size:17px;font-weight:700;border:0;border-radius:12px;background:#b91c1c;color:#fff}
button:disabled{background:#999}
video{width:100%;height:140px;background:#000;border-radius:10px;margin:10px 0;object-fit:contain}
table{width:100%;border-collapse:collapse;font-size:13px}
td{border-bottom:1px solid #ddd;padding:5px 4px;vertical-align:top}
.ok{color:#15803d;font-weight:700}.no{color:#b91c1c;font-weight:700}
small{color:#555}
</style></head><body>
<!-- 11-06 카메라 원인 찾기용 2차. 끊긴 뒤 다시 열 수 있기까지 걸리는 시간을 잼. 점검 자료·저장공간은 읽지도 쓰지도 않음 -->
<h1>📷 카메라 점검 2차</h1>
<small>점검 자료는 건드리지 않아요. 크롬 앱에서 열고, 버튼을 누른 뒤 '끝났어요'가 나올 때까지 기다려 주세요.</small>
<video id="v" autoplay playsinline muted></video>
<button id="go">시작</button>
<p id="st"></p>
<table id="t"></table>
<script>
const $ = id => document.getElementById(id), v = $('v'), t = $('t');
const wait = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const row = (a, b, ok) => { t.insertAdjacentHTML('beforeend', '<tr><td>' + esc(a) + '</td><td class="' + (ok === undefined ? '' : ok ? 'ok' : 'no') + '">' + esc(b) + '</td></tr>'); };
let start = 0;
const at = () => ((performance.now() - start) / 1000).toFixed(1) + '초';
// 열어 보고 hold 동안 지켜봄. 끊기면 바로 끝냄 (앱과 같은 속도)
async function one(name, c, hold) {
    $('st').textContent = '시험 중: ' + name;
    const t0 = performance.now();
    let s = null, good = false, text = '';
    try {
        s = await navigator.mediaDevices.getUserMedia({ video: c, audio: false });
        const tr = s.getVideoTracks()[0];
        v.srcObject = s;
        try { await v.play(); } catch (e) {}
        const end = performance.now() + hold;
        while (performance.now() < end && tr.readyState === 'live') await wait(100);
        const ms = Math.round(performance.now() - t0);
        good = tr.readyState === 'live' && v.videoWidth > 2;
        text = (good ? '정상 ' : '실패 ') + v.videoWidth + 'x' + v.videoHeight + (tr.readyState === 'live' ? '' : ' 끊김') + ' ' + ms + 'ms';
    } catch (e) {
        text = '실패 ' + e.name + ' ' + Math.round(performance.now() - t0) + 'ms';
    }
    if (s) s.getTracks().forEach(x => x.stop());
    v.srcObject = null;
    row(at() + ' ' + name, text, good);
    return good;
}
$('go').onclick = async () => {
    $('go').disabled = true; t.innerHTML = ''; start = performance.now();
    row('브라우저', navigator.userAgent.replace(/^.*?\) /, ''));
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    row('카메라', cams.map(d => d.label || '(이름 없음)').join(' / '));
    const id = n => { const d = cams.find(x => new RegExp('camera ' + n + '\\b').test(x.label)); return d ? { deviceId: { exact: d.deviceId } } : null; };
    const c0 = id(0), c2 = id(2);
    if (!c0 || !c2) { row('중단', 'camera 0·2 를 찾지 못함. 권한을 허용한 뒤 새로고침해 주세요', false); $('go').disabled = false; return; }
    // 가: 아무것도 실패하기 전에 camera 0 부터
    await one('가. camera 0 먼저', c0, 4000);
    await wait(3000);
    // 나: camera 2 실패 직후 0.8초 쉬고 camera 0 (패치 108 과 같은 순서)
    await one('나. camera 2', c2, 3000);
    await wait(800);
    await one('나. 0.8초 뒤 camera 0', c0, 3000);
    // 다: 실패가 이어져도 언제 다시 열리는지 1초 간격 (최대 20번)
    let n = 0;
    for (; n < 20; n++) { await wait(1000); if (await one('다. 다시 camera 0', c0, 2500)) break; }
    await wait(3000);
    // 라: 앱처럼 후면 지정이 무엇을 고르는지 + 다시 camera 0
    await one('라. 후면 지정', { facingMode: 'environment' }, 3000);
    await wait(5000);
    await one('라. 5초 뒤 camera 0', c0, 3000);
    $('st').textContent = '끝났어요. 표 전체를 캡처해서 보내 주세요.';
    $('go').disabled = false;
};
</script>
</body></html>
